name: OCI A1 Catcher

on:
  schedule:
    # 10분마다. GitHub 부하에 따라 수 분 지연되거나 건너뛸 수 있다.
    # 실행 하나가 5시간 돌기 때문에 그동안 걸린 스케줄은 대기열에 하나만 남고 나머지는 cancelled로 표시된다. 정상이다.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: '확보 시도 대신 알림 테스트 이슈만 만든다'
        type: boolean
        default: false

# 실행이 겹쳐서 인스턴스를 두 개 만드는 일이 없도록 한 번에 하나만 돈다.
concurrency:
  group: oci-a1-catcher
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  # 성공 알림이 실제로 메일까지 오는지 확인하는 용도.
  # 실제 확보 때와 똑같이 github-actions[bot]이 이슈를 만든다.
  notify-test:
    if: inputs.test_notification == true
    runs-on: ubuntu-latest
    steps:
      - name: 테스트 이슈 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "🔔 알림 테스트 — 이 메일이 오면 정상입니다" \
            --body "실제 인스턴스 확보 시에도 이 경로로 알림이 옵니다. 확인했으면 이 이슈를 닫으세요."

  catch:
    if: inputs.test_notification != true
    runs-on: ubuntu-latest
    # catch.sh가 300분(RUN_SECONDS=18000) 동안 시도한다. 여기에 마지막 시도 뒤의 최대 대기
    # (429 장기 백오프 10분 또는 RUNNING 대기 5분)와 설치 시간을 더해도 320분 안쪽이다.
    # job 상한은 360분. 타임아웃에 걸리면 아래 알림 스텝이 못 돌 수 있으니 여유를 둔다.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: OCI CLI 설치
        run: pip install --quiet -r requirements.txt

      - name: OCI 인증 키 준비
        env:
          KEY: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem

      - name: A1 용량 확보 시도
        id: hunt
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: /home/runner/.oci/key.pem
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}
          OCI_IMAGE: ${{ secrets.OCI_IMAGE }}
          OCI_SSH_PUBKEY: ${{ secrets.OCI_SSH_PUBKEY }}
          OCI_ADS: ${{ secrets.OCI_ADS }}
        run: ./catch.sh

      # always(): 확보 직후 job이 취소·타임아웃되더라도 caught=true가 기록돼 있으면 알림은 보낸다.
      - name: 확보 성공 시 이슈 생성
        if: ${{ always() && steps.hunt.outputs.caught == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IP: ${{ steps.hunt.outputs.public_ip }}
          INSTANCE_ID: ${{ steps.hunt.outputs.instance_id }}
        run: |
          IP="${IP:-확인 필요}"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "🎉 A1 인스턴스 확보 성공 — $IP" \
            --body "$(cat <<EOF
          Oracle Cloud Ampere A1 인스턴스를 확보했습니다.

          | 항목 | 값 |
          |---|---|
          | 공인 IP | \`$IP\` |
          | Instance ID | \`${INSTANCE_ID:-확인 필요}\` |
          | 사양 | 2 OCPU / 12GB / 부팅 100GB |

          접속:

          \`\`\`
          ssh -i ~/.ssh/oci_parkgolf ubuntu@$IP
          \`\`\`

          IP가 비어 있으면 OCI 콘솔에서 인스턴스를 확인하세요.
          이 워크플로는 방금 자동으로 비활성화됐습니다.
          다시 필요하면 Actions 탭에서 Enable 하세요.
          EOF
          )"

      # 잡고 나면 더 돌 이유가 없다. 중복 생성 가드가 막아주긴 하지만
      # 계속 깨어나 실행 이력만 쌓는 것도 의미가 없으므로 스스로 끈다.
      - name: 확보 성공 시 워크플로 비활성화
        if: ${{ always() && steps.hunt.outputs.caught == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow disable catch.yml --repo "$GITHUB_REPOSITORY"
          echo "🛑 워크플로를 비활성화했습니다. 다시 켜려면 Actions 탭에서 Enable 하세요." >> "$GITHUB_STEP_SUMMARY"

      # 공개 리포의 스케줄 워크플로는 60일간 커밋이 없으면 GitHub이 자동으로 끈다.
      # enable API를 호출하면 그 타이머가 리셋된다 (이미 켜져 있으면 아무 변화 없음).
      # 바로 위에서 방금 껐다면 다시 켜면 안 되므로 확보하지 못한 실행에서만 돈다.
      - name: 60일 자동 비활성화 방지
        if: ${{ always() && steps.hunt.outputs.caught != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable catch.yml --repo "$GITHUB_REPOSITORY"
